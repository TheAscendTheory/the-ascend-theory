name: Deploy independent Ascend Hub to GitHub Pages
on:
  push:
    branches: [ascend-hub-functional-foundation]
    paths:
      - standalone/hub/**
      - .github/workflows/ascend-hub-pages.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: hub-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: ascend-hub-preview
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: standalone/hub
      - name: Allow artifact indexing
        run: sleep 20
      - id: deploy
        uses: actions/deploy-pages@v4
