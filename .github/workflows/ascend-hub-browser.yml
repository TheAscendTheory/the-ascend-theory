name: Ascend Hub public mobile browser acceptance
on:
  push:
    branches: [ascend-hub-functional-foundation]
    paths:
      - ".github/workflows/ascend-hub-browser.yml"
      - ".github/scripts/hub-browser-smoke.cjs"
      - "standalone/hub/index.html"
  workflow_dispatch:
jobs:
  mobile-explorer:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser test runtime
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install chromium
      - name: Test real public Hub in mobile browser
        run: node .github/scripts/hub-browser-smoke.cjs
