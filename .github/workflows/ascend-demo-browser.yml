name: Ascenders Academy and Media demo browser acceptance
on:
  push:
    branches: [ascend-hub-functional-foundation]
    paths:
      - '.github/workflows/ascend-demo-browser.yml'
      - '.github/scripts/ascend-demo-browser-smoke.cjs'
  workflow_dispatch:
jobs:
  demo-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install mobile web test browser
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install chromium
      - name: Validate real published demonstration flows
        run: node .github/scripts/ascend-demo-browser-smoke.cjs
