name: Publish Ascenders App Previews
on:
  push:
    branches:
      - gh-pages
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ascenders-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
      - name: Prepare static review
        run: |
          mkdir -p ./public-preview
          cp ./index.html ./public-preview/index.html
          touch ./public-preview/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload preview
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public-preview
      - name: Deploy review site
        id: deployment
        uses: actions/deploy-pages@v4
