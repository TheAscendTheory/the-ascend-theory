<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101512"><title>Ascend Academy · Learn your way</title><style>:root{--bg:#101512;--panel:#19221c;--panel2:#222d25;--line:#354039;--ink:#f7f4ed;--muted:#b0beb3;--gold:#c5ab72;--green:#88bd91}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}.shell{max-width:1440px;margin:auto}.top{height:70px;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:0 29px;border-bottom:1px solid var(--line);background:#111713}.wordmark{letter-spacing:.2em;font-size:13px;font-weight:850}.wordmark small{display:block;font-size:9px;letter-spacing:.17em;color:var(--muted);font-weight:450;margin-top:5px}.top a,.top button{color:var(--muted);font-size:12px}.badge{padding:7px 12px;border:1px solid #6d5940;border-radius:80px;color:var(--gold);font-size:10px;letter-spacing:.12em;font-weight:700;white-space:nowrap}.demo{color:#f3d6a4;background:#473822;padding:8px 15px;font-size:11px;font-weight:700;text-align:center}.workspace{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:calc(100vh - 105px)}.sidebar{border-right:1px solid var(--line);padding:30px 19px;background:#141a16}.sideLabel{font-size:10px;letter-spacing:.2em;color:var(--gold);font-weight:800;margin:0 0 20px 12px}.sideButton{border:0;background:none;color:var(--muted);text-align:left;width:100%;padding:14px 13px;border-radius:9px;font-size:13px;font-weight:600}.sideButton.active{background:#2b3b30;color:var(--ink)}.sideButton:hover{background:#243129}.sidebarInfo{margin-top:34px;border-top:1px solid var(--line);padding:20px 12px;color:#879b8a;font-size:12px;line-height:1.7}.main{min-width:0;padding:28px 34px 90px}.eyebrow{font-size:11px;letter-spacing:.18em;color:var(--gold);font-weight:800}.feature{border-radius:15px;min-height:310px;background:radial-gradient(circle at 82% 18%,#54785b55,transparent 42%),linear-gradient(125deg,#293a2e,#141e18 68%);border:1px solid #344e39;padding:44px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}.feature:after{content:"✧";position:absolute;right:6%;top:18%;font:220px Georgia,serif;opacity:.08;pointer-events:none}.feature h1{font:400 clamp(45px,7vw,89px)/1.05 Georgia,serif;letter-spacing:-.06em;max-width:650px;margin:18px 0}.feature p{color:#c5d2c4;line-height:1.65;max-width:590px;font-size:15px}.cta{background:var(--gold);color:#1b211b;border:0;border-radius:8px;padding:13px 20px;min-height:45px;font-size:13px;font-weight:800;display:inline-block}.ghost{background:#ffffff0c;color:var(--ink);border:1px solid #4a5f4b;border-radius:8px;padding:12px 17px;font-size:13px;min-height:43px}.feature .cta{align-self:flex-start;margin-top:12px}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:30px 0 17px}.sectionhead h2{font:400 28px Georgia,serif;letter-spacing:-.025em;margin:0}.count{font-size:12px;color:var(--muted)}.searchbar{display:flex;gap:10px;margin-top:24px}.searchbar input,.searchbar select{width:100%;border:1px solid #3e5143;background:#202b23;color:var(--ink);border-radius:9px;padding:12px 14px;min-width:0;outline-color:var(--gold)}.searchbar select{max-width:210px}.coursegrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.coursecard{background:#1d2720;border:1px solid #364638;border-radius:13px;overflow:hidden;text-align:left;color:var(--ink);padding:0;min-width:0}.coursecard:hover{border-color:var(--gold)}.courseart{height:155px;display:grid;place-items:center;background:linear-gradient(125deg,#55624c,#25372e);color:#d9d4b7;font:72px Georgia,serif}.coursecard:nth-child(2) .courseart{background:linear-gradient(135deg,#453f37,#6a4534,#201e1b)}.coursecard:nth-child(3) .courseart{background:linear-gradient(135deg,#393b55,#254f4a,#22292f)}.coursecopy{padding:19px}.coursecopy b{font-size:10px;letter-spacing:.12em;color:var(--gold)}.coursecopy h3{font:400 26px/1.12 Georgia,serif;min-height:58px;margin:12px 0}.coursecopy p{color:var(--muted);font-size:12px;line-height:1.6;min-height:49px}.coursecopy .foot{display:flex;justify-content:space-between;color:var(--gold);font-size:12px;font-weight:750;margin-top:19px}.coursehead{display:flex;gap:13px;align-items:center;margin-bottom:18px;flex-wrap:wrap}.coursehead h1{font:400 clamp(32px,4.7vw,54px)/1.1 Georgia,serif;letter-spacing:-.045em;margin:8px 0}.coursehead p{color:var(--muted);line-height:1.5;margin:0}.learnlayout{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:20px}.lessonview{min-width:0}.lessonstage{background:#1a241d;border:1px solid #37483b;border-radius:13px;padding:25px;min-height:300px}.lessonstage h2{font:400 35px Georgia,serif;margin:14px 0}.lessonstage p{color:#c8d2c5;font-size:16px;line-height:1.85;white-space:pre-wrap}.modes{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}.modes button{border:1px solid #536254;color:#d5e0d2;background:#243129;padding:10px 14px;border-radius:8px;font-size:12px}.modes button.active{background:var(--gold);color:#181c17;border-color:var(--gold);font-weight:800}.lessonoutline{background:#1b241e;border:1px solid var(--line);border-radius:13px;padding:18px;align-self:start}.lessonoutline h3{font:400 24px Georgia,serif;margin:8px 0 19px}.lessonoutline button{display:block;border:1px solid #3b4b3e;background:#253026;width:100%;text-align:left;padding:13px 12px;color:#ebeee8;border-radius:8px;margin:8px 0;font-size:13px}.lessonoutline button.active{border-color:var(--gold);background:#334236}.lessonoutline .mini{color:var(--gold);font-size:10px;display:block;margin-bottom:5px;letter-spacing:.08em}.question{background:#253128;border:1px solid #52604e;padding:19px;border-radius:11px;margin:16px 0}.question h3{font-size:16px;font-weight:600}.choice{display:block;background:#1e2922;border:1px solid #536454;border-radius:8px;padding:13px 15px;margin:8px 0;color:var(--ink);width:100%;text-align:left}.choice.chosen{border-color:var(--gold);background:#394738}.feedback{color:var(--gold);margin-top:12px}.progress{height:6px;border-radius:100px;overflow:hidden;background:#405044;margin:16px 0}.progress>i{display:block;background:var(--gold);height:100%}.status{padding:19px;border:1px solid #5b664e;background:#28342a;border-radius:10px;color:#e5ecd9;line-height:1.6;margin-top:15px}.video{width:100%;max-height:475px;aspect-ratio:16/9;background:#0b0d0b;border-radius:9px}.error{color:#eac0b6;padding:14px}@media(max-width:1000px){.coursegrid{grid-template-columns:repeat(2,minmax(0,1fr))}.learnlayout{grid-template-columns:1fr}.lessonoutline{order:-1}}@media(max-width:730px){.top{padding:0 17px;height:62px}.workspace{grid-template-columns:1fr}.sidebar{display:flex;gap:6px;padding:11px 15px;overflow:auto;position:sticky;top:0;z-index:20}.sideLabel,.sidebarInfo{display:none}.sideButton{width:auto;white-space:nowrap;padding:10px 15px}.main{padding:18px 16px 70px}.feature{padding:25px 23px;min-height:285px}.feature h1{font-size:55px}.feature p{font-size:13px}.coursegrid{grid-template-columns:1fr}.courseart{height:140px}.searchbar{display:block}.searchbar select{margin-top:9px;max-width:none}.lessonstage{padding:18px}.coursehead h1{font-size:36px}.top .homeLink{display:none}}</style></head><body><div class="shell"><header class="top"><div class="wordmark">ASCEND ACADEMY<small>THE ASCENDERS CLUB</small></div><span class="badge">LEARNING STUDIO</span><a class="homeLink" href="../">Ascenders Hub</a></header><div class="demo">DEMO MODE · Sample courses and marks are fictional, for testing only</div><div class="workspace"><aside class="sidebar"><p class="sideLabel">DISCOVER & LEARN</p><button class="sideButton active" data-nav="browse">✧ &nbsp; Explore courses</button><button class="sideButton" data-nav="classroom">▤ &nbsp; My classroom</button><button class="sideButton" data-nav="search">⌕ &nbsp; Search subjects</button><p class="sidebarInfo">Each discipline deserves its own method. Watch, read, listen and practice without penalties.</p></aside><main class="main" id="app"><p>Opening your Academy…</p></main></div></div><script type="module">import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.4/+esm';
const root=document.getElementById("app");
const db=createClient("https://iigetmiputlcdthhhpps.supabase.co","sb_publishable_CXx9TuAZeTcjx6wCeMUFJg_2RIHFMNo");
let courses=[],course=null,lessons=[],lesson=null,mode="passage",search="",category="all",quizMode=false,answers={},grade=null,progress=JSON.parse(sessionStorage.getItem("ascend_academy_demo_progress")||"{}"),loading=true;
const escapeHTML=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safe=s=>{try{const u=new URL(s);return u.protocol==="https:"?u.href:null}catch{return null}};
function nav(tab){document.querySelectorAll("[data-nav]").forEach(el=>el.classList.toggle("active",el.dataset.nav===tab));}
function renderLibrary(){
 nav("browse");course=null;lesson=null;quizMode=false;
 const vals=[...new Set(courses.map(c=>c.discipline).filter(Boolean))].sort();
 const list=courses.filter(c=>(category==="all"||c.discipline===category)&&[c.title,c.summary,c.discipline].join(" ").toLowerCase().includes(search.toLowerCase()));
 root.innerHTML='<div class="feature"><div class="eyebrow">YOUR LEARNING. YOUR PACE.</div><h1>Learn the art of understanding.</h1><p>Explore guided masterclasses, practical exercises and thoughtfully structured lessons. Watch, read, listen or practice. No lives to lose.</p><button id="begin" class="cta">Explore the classroom →</button></div><div class="searchbar"><input id="search" type="search" placeholder="Search disciplines, ideas and courses" aria-label="Search courses" value="'+escapeHTML(search)+'"><select id="category" aria-label="Filter discipline"><option value="all">All disciplines</option>'+vals.map(c=>'<option value="'+escapeHTML(c)+'" '+(category===c?'selected':'')+'>'+escapeHTML(c)+'</option>').join('')+'</select></div><div class="sectionhead"><h2>Featured learning paths</h2><span class="count">'+list.length+' courses</span></div><div class="coursegrid">'+list.map((c,i)=>'<button class="coursecard" data-course="'+escapeHTML(c.id)+'"><div class="courseart">'+(safe(c.cover_url)?'<img alt="" src="'+escapeHTML(safe(c.cover_url))+'" style="width:100%;height:100%;object-fit:cover">':['✧','◈','✦'][i%3])+'</div><div class="coursecopy"><b>'+(c.demo?'DEMO MASTERCLASS · ':'')+escapeHTML(c.discipline||"Interdisciplinary")+'</b><h3>'+escapeHTML(c.title)+'</h3><p>'+escapeHTML(c.summary)+'</p><div class="foot"><span>COURSE OVERVIEW</span><span>Explore →</span></div></div></button>').join('')+'</div>';
 document.getElementById("begin").onclick=()=>document.querySelector(".searchbar").scrollIntoView({behavior:"smooth"});
 document.getElementById("search").oninput=e=>{search=e.target.value;const pos=e.target.selectionStart;renderLibrary();document.getElementById("search").focus();document.getElementById("search").setSelectionRange(pos,pos)};
 document.getElementById("category").onchange=e=>{category=e.target.value;renderLibrary()};
 document.querySelectorAll("[data-course]").forEach(b=>b.onclick=()=>openCourse(b.dataset.course));
}
async function openCourse(id){
 course=courses.find(c=>c.id===id);if(!course)return;
 quizMode=false;grade=null;answers={};nav("classroom");
 if(course.demo){lessons=course.lessons||[]}else{const r=await db.from("ascend_academy_lessons").select("id,title,content,sequence").eq("course_id",id).eq("published",true).order("sequence");lessons=r.data||[]}
 lesson=lessons[0]||null;mode="passage";renderClassroom();
}
function getFormats(){return course?.demo?(lesson?.formats||[]):[]}
function renderClassroom(){
 nav("classroom");
 const current=lessons.findIndex(x=>x.id===lesson?.id);
 const completed=lessons.filter(l=>progress[l.id]).length;
 root.innerHTML='<div class="coursehead"><div><div class="eyebrow">'+(course.demo?'DEMO LEARNING STUDIO · ':'')+escapeHTML(course.discipline||"COURSE")+'</div><h1>'+escapeHTML(course.title)+'</h1><p>'+escapeHTML(course.summary)+'</p></div><button class="ghost" id="back">← Course library</button></div><div class="learnlayout"><div class="lessonview"><div class="lessonstage" id="stage"></div><div class="sectionhead"><h2>Study at your pace</h2><span class="count">'+completed+' of '+lessons.length+' lessons completed</span></div><div class="progress"><i style="width:'+(lessons.length?Math.round(completed/lessons.length*100):0)+'%"></i></div></div><aside class="lessonoutline"><span class="eyebrow">YOUR CLASSROOM</span><h3>Course chapters</h3>'+lessons.map((l,i)=>'<button data-lesson="'+i+'" class="'+(!quizMode&&i===current?'active':'')+'"><span class="mini">'+(progress[l.id]?'✓ COMPLETED':'LESSON '+(i+1))+'</span>'+escapeHTML(l.title)+'</button>').join('')+(course.quiz?.length?'<button id="openQuiz" class="'+(quizMode?'active':'')+'"><span class="mini">KNOWLEDGE CHECK</span>Practice assessment</button>':'')+'</aside></div>';
 document.getElementById("back").onclick=renderLibrary;
 document.querySelectorAll("[data-lesson]").forEach(b=>b.onclick=()=>{lesson=lessons[Number(b.dataset.lesson)];quizMode=false;mode="passage";renderClassroom()});
 const qbtn=document.getElementById("openQuiz");if(qbtn)qbtn.onclick=()=>{quizMode=true;grade=null;answers={};renderClassroom()};
 if(quizMode){renderQuiz();return}
 const stage=document.getElementById("stage");
 if(!lesson){stage.innerHTML='<h2>Lessons are being prepared.</h2>';return}
 const f=getFormats(),avail=["video","passage","audio","interactive"];
 stage.innerHTML='<div class="eyebrow">CHAPTER '+(current+1)+' · CHOOSE YOUR LEARNING EXPERIENCE</div><h2>'+escapeHTML(lesson.title)+'</h2><div class="modes">'+avail.map(m=>'<button data-mode="'+m+'" class="'+(m===mode?'active':'')+'">'+({video:"▶ Watch",passage:"▤ Read",audio:"♫ Listen",interactive:"◎ Practice"}[m])+'</button>').join('')+'</div><div id="lessonMaterial"></div><div style="margin-top:25px;display:flex;gap:10px;flex-wrap:wrap"><button class="cta" id="complete">Mark lesson complete ✓</button>'+(current<lessons.length-1?'<button class="ghost" id="next">Next chapter →</button>':'')+'</div>';
 document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll("[data-mode]").forEach(x=>x.classList.toggle("active",x===b));showMaterial()});
 document.getElementById("complete").onclick=()=>{progress[lesson.id]=true;sessionStorage.setItem("ascend_academy_demo_progress",JSON.stringify(progress));renderClassroom()};
 if(document.getElementById("next"))document.getElementById("next").onclick=()=>{lesson=lessons[current+1];mode="passage";renderClassroom()};
 showMaterial();
}
function showMaterial(){
 const e=document.getElementById("lessonMaterial");if(!e)return;
 const formats=getFormats(),f=formats.find(x=>x.format===mode);
 if(!f&&mode!=="passage"){e.innerHTML='<div class="status">This lesson does not yet have a '+escapeHTML(mode)+' edition. Choose Read to continue learning.</div>';return}
 const body=f?.body||lesson.content||"";
 if(mode==="video"||mode==="audio"){
  if(safe(f?.source_url)){e.innerHTML='<div class="eyebrow">'+(mode==="audio"?"LISTENING LESSON":"VIDEO SESSION")+'</div><h3>'+escapeHTML(f.title||"Learning session")+'</h3><p>'+escapeHTML(body)+'</p>'+(mode==="audio"?'<audio controls style="width:100%;margin:20px 0" src="'+escapeHTML(safe(f.source_url))+'"></audio>':'<video controls playsinline class="video" src="'+escapeHTML(safe(f.source_url))+'"></video>')+'<div class="count">Technical demo recording, not an original Academy lecture.</div>'}else e.innerHTML='<div class="status">This format is not published yet.</div>';
 }else if(mode==="interactive"&&f?.choices){
  e.innerHTML='<div class="question"><div class="eyebrow">ACTIVE PRACTICE · UNLIMITED TRIES</div><h3>'+escapeHTML(f.body)+'</h3>'+f.choices.map((c,i)=>'<button class="choice" data-answer="'+i+'">'+escapeHTML(c)+'</button>').join('')+'<div class="feedback" id="practiceFeedback"></div></div>';
  e.querySelectorAll("[data-answer]").forEach(b=>b.onclick=()=>{e.querySelectorAll("[data-answer]").forEach(x=>x.classList.toggle("chosen",x===b));document.getElementById("practiceFeedback").textContent=Number(b.dataset.answer)===f.answer?"Correct. The relationship is what matters.":"Not quite. Try another choice. There are no lives to lose."});
 }else e.innerHTML='<div class="eyebrow">READING EXPERIENCE</div><p>'+escapeHTML(body)+'</p>';
}
function renderQuiz(){
 const area=document.getElementById("stage"),qs=course.quiz||[];
 area.innerHTML='<div class="eyebrow">PERSONAL KNOWLEDGE CHECK · NO PENALTY FOR RETAKING</div><h2>Practice assessment</h2><p>Take your time, review your marks, and try again as often as you wish.</p>'+qs.map((q,i)=>'<div class="question"><h3>'+(i+1)+'. '+escapeHTML(q.prompt)+'</h3>'+q.choices.map((c,j)=>'<button class="choice '+(answers[i]===j?'chosen':'')+'" data-q="'+i+'" data-a="'+j+'">'+escapeHTML(c)+'</button>').join('')+'</div>').join('')+'<button id="submitQuiz" class="cta">See my marks</button><div id="quizResult"></div>';
 area.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{answers[Number(b.dataset.q)]=Number(b.dataset.a);renderQuiz()});
 document.getElementById("submitQuiz").onclick=()=>{if(Object.keys(answers).length!==qs.length){document.getElementById("quizResult").innerHTML='<div class="status">Answer all questions before submitting.</div>';return}const correct=qs.filter((q,i)=>answers[i]===q.answer).length;const score=Math.round(correct*100/qs.length);document.getElementById("quizResult").innerHTML='<div class="status"><strong>'+score+'% · '+correct+'/'+qs.length+' correct</strong><p>DEMO marks only. Nothing was saved to a real student record.</p><button class="ghost" id="retry">Try again ↻</button></div>';document.getElementById("retry").onclick=()=>{answers={};renderQuiz()}};
}
async function load(){try{const [real,demos]=await Promise.all([db.from("ascend_academy_courses").select("id,title,slug,summary,discipline,cover_url").eq("published",true).limit(100),db.from("ascend_demo_fixtures").select("payload").eq("kind","academy_course")]);courses=[...(real.data||[]),...(demos.data||[]).map(x=>x.payload)];loading=false;renderLibrary()}catch(error){root.innerHTML='<div class="error">The learning library could not load: '+escapeHTML(error.message)+'</div>'}}
document.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>{if(b.dataset.nav==="browse")renderLibrary();else if(b.dataset.nav==="classroom"){if(course)renderClassroom();else renderLibrary()}else{renderLibrary();document.getElementById("search").focus()}});load();
</script></body></html>
